# Backend on Render. Frontend: deploy /frontend on Vercel (root directory = frontend).
services:
  - type: web
    name: fireflies-clone-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS        # set to your Vercel URL, comma-separated for several
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.3
